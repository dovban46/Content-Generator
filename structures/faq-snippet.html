<!-- Вставляти ЦЕЙ блок цілком у WP як Custom HTML (в редакторі: Code editor, вставити; коментарі wp:html лишити). Кольори адаптивні (currentColor/inherit), підходять під будь-яку тему, світлу чи темну. Перше питання open. -->
<!-- wp:html -->
<style>
.faq-wp summary::-webkit-details-marker{display:none}
.faq-wp summary::marker{content:""}
.faq-wp details[open] summary>span:last-child{display:inline-block;transform:rotate(180deg)}
</style>
<div class="faq-wp" itemscope itemtype="https://schema.org/FAQPage" style="margin:24px 0">

<div itemscope itemprop="acceptedAnswer" itemtype="https://schema.org/Answer" style="padding:4px 16px 12px;background:transparent;color:inherit"><div itemprop="text"><p style="margin:8px 0;color:inherit !important;-webkit-text-fill-color:currentColor !important">Відповідь, 50+ слів.</p></div></div>
</details>
